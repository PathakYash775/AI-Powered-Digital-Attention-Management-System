<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attention Management System - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    .code-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      text-align: left;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #2563eb; }
    .btn:active { transform: scale(0.98); }
    .retry-countdown {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <div class="status-badge">
      <span class="pulse-dot"></span>
      Dashboard Unavailable
    </div>
    <h1>Connecting to Attention System...</h1>
    <p>
      The desktop app could not reach the web dashboard. Ensure the local servers are running:
    </p>
    <div class="code-box">
      pnpm dev
    </div>
    <p style="font-size: 13px; margin-bottom: 20px;">
      Target: <strong>http://localhost:5173</strong> (Frontend) &bull; <strong>http://localhost:8000</strong> (Backend)
    </p>
    <button class="btn" id="retry-btn" onclick="retryNow()">Retry Now</button>
    <div class="retry-countdown" id="countdown-text">Auto-retrying in 5 seconds...</div>
  </div>

  <script>
    let secondsLeft = 5;
    const targetUrl = window.location.search.replace(/^\?target=/, "") || "http://localhost:5173";

    async function checkConnection() {
      try {
        const resp = await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
        // Connection succeeded, redirect
        window.location.href = targetUrl;
        return true;
      } catch (err) {
        return false;
      }
    }

    async function retryNow() {
      const btn = document.getElementById("retry-btn");
      btn.textContent = "Checking...";
      btn.disabled = true;
      const success = await checkConnection();
      if (!success) {
        btn.textContent = "Retry Now";
        btn.disabled = false;
        secondsLeft = 5;
      }
    }

    setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        retryNow();
      } else {
        document.getElementById("countdown-text").textContent = `Auto-retrying in ${secondsLeft} second${secondsLeft > 1 ? 's' : ''}...`;
      }
    }, 1000);
  </script>
</body>
</html>
